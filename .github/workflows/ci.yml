name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ruff and mypy are pinned to py313 in pyproject.toml, so one leg
  # carries the full lint signal; only pytest is version-sensitive.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy

  # Single version: colour-specio 0.4.2a0 caps requires-python at
  # <3.14, so 3.13 is both the floor (roadmap) and the ceiling. Widen
  # into a matrix when colour-specio lifts the cap.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync
      - run: uv run pytest
