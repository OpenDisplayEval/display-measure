# Dependabot version-update PRs. Security updates open PRs for vulnerability
# alerts on their own, without waiting for this schedule.
version: 2
updates:
  # Python dependencies resolved by uv (pyproject.toml + uv.lock). The git
  # dependencies, bmd-signal-generator and colour-specio, stay manual:
  # Dependabot skips a direct reference without a PR or an error, so bump
  # their tag or rev in [tool.uv.sources] by hand.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # A release has a week to draw a follow-up fix before it is proposed.
    cooldown:
      default-days: 7
    # ruff and mypy bring new findings that need code edits, so they land
    # apart from the library bumps.
    groups:
      python-lint:
        patterns: ["ruff", "mypy"]
      uv-minor-patch:
        patterns: ["*"]
        exclude-patterns: ["ruff", "mypy"]
        update-types: [minor, patch]
    # `chore(deps):` is one of flywheel's auto_merge types (.flywheel.yml), so
    # a bump lands once the required checks pass: quality / correctness is
    # the gate, and the cooldown is the soak.
    commit-message:
      prefix: chore
      include: scope

  # Dependabot bumps a SHA pin and rewrites its trailing version comment, and
  # bumps a tag ref (actions/checkout@v5) to the next tag. The notation
  # reusable workflow follows the floating notation--v0 tag, which Dependabot
  # does not track.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope
